services:
  - type: web
    name: altheiapulse
    env: docker
    plan: free
    branch: main
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: JWT_SECRET
        value: "replace-with-a-secure-secret"
    databases:
      - name: altheiapulse-postgres

databases:
  - name: altheiapulse-postgres
    plan: free
    region: oregon
    databaseName: altheiapulse
