services:
  - type: web
    name: altheiapulse-backend
    env: python
    plan: free
    branch: main
    root: ./
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/app.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: JWT_SECRET
        value: "replace-with-a-secure-secret"
    databases:
      - name: altheiapulse-postgres

  - type: static_site
    name: altheiapulse-frontend
    env: static
    plan: free
    branch: main
    root: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://altheiapulse-backend.onrender.com"

databases:
  - name: altheiapulse-postgres
    plan: free
    region: oregon
    databaseName: altheiapulse
