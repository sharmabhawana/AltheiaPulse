services:
  - type: web
    name: altheiapulse
    env: python
    plan: free
    branch: main
    root: ./
    pythonVersion: "3.11"
    buildCommand: cd frontend && npm install && npm run build && cd .. && python -m pip install --upgrade pip setuptools wheel && python -m pip install -r requirements.txt
    startCommand: "bash ./start.sh"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: JWT_SECRET
        value: "replace-with-a-secure-secret"
    databases:
      - name: altheiapulse-postgres

databases:
  - name: altheiapulse-postgres
    plan: free
    region: oregon
    databaseName: altheiapulse
